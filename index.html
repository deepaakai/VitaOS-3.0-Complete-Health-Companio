<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14302B">
<title>VitaOS</title>
<style>
:root{--bg:#EEF4F0;--paper:#fff;--ink:#14302B;--sub:#5C7570;--line:#D5E2DB;--water:#2F7DF6;--waterd:#1B5BC4;--gold:#E9A23B;--ok:#1F9D6B;--bad:#D6453D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:19px;letter-spacing:.2px}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#cfe3dc;font:inherit;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px}
.lang button.on{background:#fff;color:var(--ink)}
main{max-width:520px;margin:0 auto;padding:18px 18px 8px}
section{padding:18px 0;border-bottom:1px solid var(--line)}
section:last-child{border-bottom:0}
h2{margin:0 0 4px;font-size:18px}
.sub{color:var(--sub);font-size:14px;margin:0 0 12px}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:transparent;padding:10px 0 9px;font:inherit;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:var(--ink);font-weight:700}
nav button.on i{transform:translateY(-1px)}
.glass-wrap{display:flex;flex-direction:column;align-items:center}
.glass{border:0;background:transparent;padding:0;width:210px}
.glass svg{width:100%;display:block}
.water-num{font-size:34px;font-weight:800;margin-top:2px}
.water-num small{font-size:16px;font-weight:600;color:var(--sub)}
.row{display:flex;gap:10px}
.btn{border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;font-size:15px;background:var(--ink);color:#fff;flex:1}
.btn.blue{background:var(--water)}
.btn.soft{background:#E1ECE6;color:var(--ink)}
.btn.red{background:#FBE5E3;color:var(--bad)}
.btn:active{transform:scale(.97)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--sub)}
.bar{height:10px;border-radius:99px;background:#DCE8E1;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left}
.task:last-child{border-bottom:0}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid #A9C0B6;display:grid;place-items:center;color:#fff;font-size:15px;flex-shrink:0}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task.done .nm{text-decoration:line-through;color:var(--sub)}
.task .nm{flex:1;font-weight:600}
.task .tm{font-size:13px;color:var(--sub)}
.x{border:0;background:none;color:var(--bad);font-size:18px;padding:4px 8px}
label{display:block;font-size:13px;color:var(--sub);margin:0 0 4px;font-weight:600}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--ink)}
input:focus,select:focus{outline:0;border-color:var(--water)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font:inherit;font-size:14px;color:var(--ink)}
.chip:active{background:#E1ECE6}
.food{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.food small{color:var(--sub)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#E1ECE6}
.ex{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.ex a{color:var(--water);font-weight:700;font-size:14px;text-decoration:none}
.note{background:#FFF4DF;border-radius:12px;padding:12px;font-size:13.5px;margin:10px 0}
pre{white-space:pre-wrap;font-size:13px;background:#fff;border-radius:12px;padding:12px}
svg text{font-family:inherit}
</style>
</head>
<body>
<header><b>VitaOS</b><div class="lang"><button id="lhi">हिंदी</button><button id="len">EN</button></div></header>
<main>
  <div class="tab on" id="tab-today"></div>
  <div class="tab" id="tab-food"></div>
  <div class="tab" id="tab-body"></div>
  <div class="tab" id="tab-more"></div>
</main>
<nav id="nav"></nav>

<script>
/* ============ TEXT (Hindi / English) ============ */
const TX={
en:{today:'Today',food:'Food',body:'Body',more:'Settings',water:'Water',of:'of',glass:'+ 1 glass (250 ml)',undo:'Undo',goalDone:'Goal complete. Well done.',

 profile:'Your details',height:'Height (cm)',weight:'Weight (kg)',age:'Age',gender:'Gender',male:'Male',female:'Female',activity:'Activity',
 a1:'Sedentary',a2:'Light',a3:'Moderate',a4:'Active',a5:'Very active',goal:'Goal',gain:'Gain weight',maintain:'Maintain',lose:'Lose weight',
 save:'Save',saved:'Saved',bmi:'BMI',under:'Underweight',normal:'Normal',over:'Overweight',obese:'Obese',
 logWeight:'Log weight',todayW:"Today's weight",sleep:'Sleep (hours)',sleepSub:'How long did you sleep last night?',
 weightTrend:'Weight trend',needTwo:'Log weight on 2 or more days to see the graph.',

 lang:'Language',backup:'Backup',export:'Copy backup',import:'Restore backup',pasteHere:'Paste your backup text here:',copied:'Backup copied. Paste it in Notes/WhatsApp to keep it.',restored:'Restored.',badBackup:'That backup is not valid.',
 routineEdit:'Edit routine',taskName:'Task name',addTask:'Add task',reset:'Delete all data',confirmReset:'Delete everything? This cannot be undone.',
 tWake:'Drink 2 glasses of water',tBreak:'Breakfast + protein',tVit:'Vitamins (as per doctor)',tLunch:'Lunch + protein',tSnack:'Snack: nuts / banana / milk',tGym:'Workout',tDinner:'Dinner',tMilk:'1 glass warm milk',tSleep:'Sleep on time',

 sets:(s,r)=>`${s} sets × ${r}`,secs:(s)=>`3 × ${s} sec`,mins:(m)=>`${m} min`,
 note:'This app gives general guidance only. For weight or health concerns, please see a doctor.'},
hi:{today:'आज',food:'खाना',body:'शरीर',more:'सेटिंग',water:'पानी',of:'में से',glass:'+ 1 गिलास (250 ml)',undo:'वापस',goalDone:'आज का लक्ष्य पूरा। शाबाश!',

 routine:'रोज़ का रूटीन',routineSub:'पूरा होने पर टैप करो।',kcal:'kcal',protein:'प्रोटीन',eaten:'खाया',left:'बाकी',target:'लक्ष्य',
 quick:'जल्दी जोड़ो',foodName:'खाने का नाम',cal:'कैलोरी',prot:'प्रोटीन (g)',add:'जोड़ो',todayFood:'आज का खाना',none:'अभी कुछ नहीं।',
 profile:'तुम्हारी जानकारी',height:'ऊँचाई (cm)',weight:'वज़न (kg)',age:'उम्र',gender:'लिंग',male:'पुरुष',female:'महिला',activity:'एक्टिविटी',
 a1:'बैठे रहना',a2:'हल्की',a3:'मध्यम',a4:'एक्टिव',a5:'बहुत एक्टिव',goal:'लक्ष्य',gain:'वज़न बढ़ाना',maintain:'वैसा ही रखना',lose:'वज़न घटाना',

 lang:'भाषा',backup:'बैकअप',export:'बैकअप कॉपी करो',import:'बैकअप वापस लाओ',pasteHere:'अपना बैकअप टेक्स्ट यहाँ पेस्ट करो:',copied:'बैकअप कॉपी हो गया। इसे Notes/WhatsApp में रख लो।',restored:'वापस आ गया।',badBackup:'यह बैकअप सही नहीं है।',

 tWake:'2 गिलास पानी',tBreak:'नाश्ता + प्रोटीन',tVit:'विटामिन (डॉक्टर के अनुसार)',tLunch:'लंच + प्रोटीन',tSnack:'स्नैक: मेवे / केला / दूध',tGym:'वर्कआउट',tDinner:'रात का खाना',tMilk:'1 गिलास गर्म दूध',tSleep:'समय पर सोना',
 e1:'पुश-अप्स',e2:'स्क्वाट्स',e3:'प्लैंक',e4:'लंजेस',e5:'बाइसेप कर्ल',e6:'तेज़ वॉक',
 sets:(s,r)=>`${s} सेट × ${r}`,secs:(s)=>`3 × ${s} सेकंड`,mins:(m)=>`${m} मिनट`,
 note:'यह ऐप सिर्फ सामान्य सलाह देता है। वज़न या सेहत की चिंता हो तो डॉक्टर से मिलो।'}
};
const FOODS=[ // [key en, key hi, kcal, protein]
 ['Roti','रोटी',100,3],['Rice (1 cup)','चावल (1 कटोरी)',200,4],['Dal (1 bowl)','दाल (1 कटोरी)',150,9],['Egg','अंडा',78,6],
 ['Banana','केला',105,1],['Milk (1 glass)','दूध (1 गिलास)',150,8],['Paneer (100 g)','पनीर (100 g)',265,18],['Peanuts (handful)','मूंगफली (मुट्ठी)',170,7],
 ['Curd (1 bowl)','दही (1 कटोरी)',100,6],['Soya chunks (50 g)','सोया चंक (50 g)',170,26]
];
const DEFAULT_TASKS=[
 {id:'d1',key:'tWake',time:'06:30'},{id:'d2',key:'tBreak',time:'08:00'},{id:'d3',key:'tVit',time:'09:00'},
 {id:'d4',key:'tLunch',time:'13:00'},{id:'d5',key:'tSnack',time:'16:30'},{id:'d6',key:'tGym',time:'18:00'},
 {id:'d7',key:'tDinner',time:'20:30'},{id:'d8',key:'tMilk',time:'21:30'},{id:'d9',key:'tSleep',time:'22:30'}
];

/* ============ DATA ============ */
const KEY='vitaos4';
function fresh(){return{lang:'hi',profile:{h:165,w:48,a:25,g:'male',act:1.55,goal:'gain'},days:{},weights:{},tasks:DEFAULT_TASKS.map(x=>({...x}))}}
function loadDB(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&d.profile?Object.assign(fresh(),d):fresh()}catch(e){return fresh()}}
let db=loadDB();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const t=k=>TX[db.lang][k]??TX.en[k]??k;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function dstr(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function day(){const k=dstr();return db.days[k]||(db.days[k]={water:0,food:[],done:{},sleep:0})}
function fmt12(s){const[h,m]=s.split(':').map(Number);return(h%12||12)+':'+pad(m)+' '+(h>=12?'PM':'AM')}

/* ============ TARGETS (one place, one formula) ============ */
function targets(){
  const p=db.profile;
  const bmi=p.w/Math.pow(p.h/100,2);
  const cat=bmi<18.5?'under':bmi<25?'normal':bmi<30?'over':'obese';
  const bmr=10*p.w+6.25*p.h-5*p.a+(p.g==='male'?5:-161);
  const tdee=bmr*p.act;
  const cal=Math.round(tdee+(p.goal==='gain'?400:p.goal==='lose'?-500:0));
  const protein=Math.round(p.w*(p.goal==='gain'?1.8:1.5));
  const active=p.act>=1.55;
  let water=Math.round((p.w*35+(active?300:0))/50)*50;
  water=Math.min(4000,Math.max(1800,water));
  return{bmi,cat,cal,protein,water,active};
}

/* ============ UI ============ */
let tab='today';
const TABS=[['today','💧'],['food','🍽️'],['body','💪'],['more','⚙️']];
function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(([k,i])=>`<button class="${k===tab?'on':''}" data-t="${k}"><i>${i}</i>${t(k)}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  document.getElementById('lhi').classList.toggle('on',db.lang==='hi');
  document.getElementById('len').classList.toggle('on',db.lang==='en');
  document.documentElement.lang=db.lang;
}

function glassSVG(frac){
  const off=(1-Math.min(1,frac))*220;
  return `<svg viewBox="0 0 200 260" aria-hidden="true">
  <defs><clipPath id="gc"><path d="M38 20H162L147 240Q146 248 138 248H62Q54 248 53 240Z"/></clipPath></defs>
  <path d="M38 20H162L147 240Q146 248 138 248H62Q54 248 53 240Z" fill="#fff"/>
  <g clip-path="url(#gc)"><g style="transform:translateY(${off}px);transition:transform .7s cubic-bezier(.3,.8,.3,1)">
    <rect x="0" y="22" width="200" height="260" fill="#2F7DF6"/>
    <path d="M0 22q25-9 50 0t50 0t50 0t50 0V34H0Z" fill="#5B9CFF"/></g></g>
  <path d="M38 20H162L147 240Q146 248 138 248H62Q54 248 53 240Z" fill="none" stroke="#14302B" stroke-width="5" stroke-linejoin="round"/></svg>`;
}

function viewToday(){
  const T=targets(),d=day(),frac=d.water/T.water;
  const sorted=db.tasks.slice().sort((a,b)=>a.time.localeCompare(b.time));
  const doneN=sorted.filter(x=>d.done[x.id]).length;
  return `
  <section class="glass-wrap">
    <button class="glass" id="glassBtn" aria-label="${t('glass')}">${glassSVG(frac)}</button>
    <div class="water-num">${d.water} <small>${t('of')} ${T.water} ml</small></div>
    <p class="sub" style="text-align:center;margin:4px 0 12px">${frac>=1?t('goalDone'):t('waterWhy')(db.profile.w,T.active)}</p>
    <div class="row" style="width:100%"><button class="btn blue" id="addW">${t('glass')}</button><button class="btn soft" id="undoW" style="flex:.45">${t('undo')}</button></div>
  </section>
  <section>
    <h2>${t('routine')} · ${doneN}/${sorted.length}</h2><p class="sub">${t('routineSub')}</p>
    ${sorted.map(x=>`<button class="task ${d.done[x.id]?'done':''}" data-id="${x.id}"><span class="chk">${d.done[x.id]?'✓':''}</span><span class="nm">${esc(x.key?t(x.key):x.name)}</span><span class="tm">${fmt12(x.time)}</span></button>`).join('')}
  </section>`;
}

function viewFood(){
  const T=targets(),d=day();
  const eat=d.food.reduce((s,x)=>s+x.cal,0),pr=d.food.reduce((s,x)=>s+(x.p||0),0);
  const left=Math.max(0,T.cal-eat),pct=Math.min(100,eat/T.cal*100);
  return `
  <section>
    <div class="stats"><div class="stat"><b>${eat}</b><span>${t('eaten')} (${t('kcal')})</span></div><div class="stat"><b>${left}</b><span>${t('left')} (${t('kcal')})</span></div><div class="stat"><b>${pr}/${T.protein}</b><span>${t('protein')} (g)</span></div></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p class="sub">${t('target')}: ${T.cal} ${t('kcal')}</p>
  </section>
  <section>
    <h2>${t('quick')}</h2>
    <div class="chips">${FOODS.map((f,i)=>`<button class="chip" data-q="${i}">${db.lang==='hi'?f[1]:f[0]} · ${f[2]}</button>`).join('')}</div>
    <div class="grid2"><div><label>${t('foodName')}</label><input id="fName"></div><div><label>${t('cal')}</label><input id="fCal" type="number" inputmode="numeric"></div></div>
    <div class="grid2"><div><label>${t('prot')}</label><input id="fProt" type="number" inputmode="numeric"></div><div style="align-self:end"><button class="btn" id="addF" style="width:100%">${t('add')}</button></div></div>
  </section>
  <section>
    <h2>${t('todayFood')}</h2>
    ${d.food.length?d.food.map((f,i)=>`<div class="food"><div>${esc(f.name)}<br><small>${f.cal} ${t('kcal')}${f.p?' · '+f.p+' g':''}</small></div><button class="x" data-f="${i}">✕</button></div>`).join(''):`<p class="sub">${t('none')}</p>`}
  </section>`;
}

function chartSVG(){
  const days=Object.keys(db.weights).sort().slice(-30);
  if(days.length<2)return `<p class="sub">${t('needTwo')}</p>`;
  const v=days.map(k=>db.weights[k]),mn=Math.min(...v)-1,mx=Math.max(...v)+1;
  const W=320,H=140,p=26;
  const pts=v.map((w,i)=>[p+(W-2*p)*i/(days.length-1),p/2+(H-p-p/2)*(1-(w-mn)/(mx-mn))]);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#fff;border-radius:14px">
   <polyline fill="none" stroke="#2F7DF6" stroke-width="3" stroke-linejoin="round" points="${pts.map(q=>q.join(',')).join(' ')}"/>
   ${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#2F7DF6"/>`).join('')}
   <text x="6" y="${p/2+8}" font-size="11" fill="#5C7570">${mx.toFixed(1)}</text><text x="6" y="${H-8}" font-size="11" fill="#5C7570">${mn.toFixed(1)}</text></svg>`;
}

const EX=[['e1',(r)=>TX[db.lang].sets(r.ps,r.pr),'push ups for beginners'],['e2',(r)=>TX[db.lang].sets(r.ps,r.sr),'squats form'],['e3',(r)=>TX[db.lang].secs(r.pl),'plank form'],['e4',(r)=>TX[db.lang].sets(2,10),'lunges form'],['e5',(r)=>TX[db.lang].sets(3,10),'bicep curls form'],['e6',(r)=>TX[db.lang].mins(r.wm),'brisk walking']];
function plan(T){
  if(T.cat==='under')return{ps:3,pr:8,sr:15,ps2:3,pl:30,wm:15};
  if(T.cat==='normal')return{ps:3,pr:12,sr:20,pl:45,wm:20};
  return{ps:3,pr:10,sr:15,pl:30,wm:30};
}

function viewBody(){
  const p=db.profile,T=targets(),d=day(),r=plan(T);r.ps=3;r.ps2=3;
  const opt=(v,l,cur)=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${l}</option>`;
  return `
  <section>
    <div class="stats"><div class="stat"><b>${T.bmi.toFixed(1)}</b><span>${t('bmi')} · ${t(T.cat)}</span></div><div class="stat"><b>${T.cal}</b><span>${t('kcal')}</span></div><div class="stat"><b>${(T.water/1000).toFixed(2)}</b><span>${t('water')} (L)</span></div></div>
  </section>
  <section>
    <h2>${t('logWeight')}</h2>
    <div class="grid2"><div><input id="wIn" type="number" step="0.1" inputmode="decimal" placeholder="${t('todayW')}"></div><div><button class="btn blue" id="wBtn" style="width:100%">${t('add')}</button></div></div>
    <h2 style="margin-top:14px">${t('weightTrend')}</h2>${chartSVG()}
  </section>
  <section>
    <h2>${t('sleep')}</h2><p class="sub">${t('sleepSub')}</p>
    <div class="chips">${[5,6,7,8,9].map(h=>`<button class="chip" data-s="${h}" style="${d.sleep===h?'background:#14302B;color:#fff':''}">${h}h</button>`).join('')}</div>
  </section>
  <section>
    <h2>${t('profile')}</h2>
    <div class="grid2"><div><label>${t('height')}</label><input id="pH" type="number" inputmode="decimal" value="${p.h}"></div><div><label>${t('weight')}</label><input id="pW" type="number" step="0.1" inputmode="decimal" value="${p.w}"></div></div>
    <div class="grid2"><div><label>${t('age')}</label><input id="pA" type="number" inputmode="numeric" value="${p.a}"></div><div><label>${t('gender')}</label><select id="pG">${opt('male',t('male'),p.g)}${opt('female',t('female'),p.g)}</select></div></div>
    <div class="grid2"><div><label>${t('activity')}</label><select id="pAct">${opt(1.2,t('a1'),p.act)}${opt(1.375,t('a2'),p.act)}${opt(1.55,t('a3'),p.act)}${opt(1.725,t('a4'),p.act)}${opt(1.9,t('a5'),p.act)}</select></div>
    <div><label>${t('goal')}</label><select id="pGoal">${opt('gain',t('gain'),p.goal)}${opt('maintain',t('maintain'),p.goal)}${opt('lose',t('lose'),p.goal)}</select></div></div>
    <button class="btn" id="pSave" style="width:100%">${t('save')}</button>
  </section>
  <section>
    <h2>${t('workout')}</h2>
    ${EX.map(([k,fn,q])=>`<div class="ex"><div><b>${t(k)}</b><br><small style="color:var(--sub)">${fn(r)}</small></div><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" rel="noopener">${t('watch')} ›</a></div>`).join('')}
    <div class="note">${t('workoutNote')}</div>
  </section>`;
}

function viewMore(){
  const sorted=db.tasks.slice().sort((a,b)=>a.time.localeCompare(b.time));
  return `
  <section>
    <h2>${t('lang')}</h2>
    <div class="row"><button class="btn ${db.lang==='hi'?'':'soft'}" data-l="hi">हिंदी</button><button class="btn ${db.lang==='en'?'':'soft'}" data-l="en">English</button></div>
  </section>
  <section>
    <h2>${t('routineEdit')}</h2>
    ${sorted.map(x=>`<div class="food"><div>${esc(x.key?t(x.key):x.name)}<br><small>${fmt12(x.time)}</small></div><button class="x" data-del="${x.id}">✕</button></div>`).join('')}
    <div class="grid2" style="margin-top:12px"><div><label>${t('taskName')}</label><input id="nName"></div><div><label>&nbsp;</label><input id="nTime" type="time" value="08:00"></div></div>
    <button class="btn soft" id="nAdd" style="width:100%">${t('addTask')}</button>
  </section>
  <section>
    <h2>${t('backup')}</h2>
    <div class="row"><button class="btn soft" id="bExp">${t('export')}</button><button class="btn soft" id="bImp">${t('import')}</button></div>
  </section>
  <section>
    <button class="btn red" id="wipe" style="width:100%">${t('reset')}</button>
    <p class="sub" style="margin-top:14px">${t('note')}</p>
  </section>`;
}

function render(){
  renderNav();
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='tab-'+tab));
  const el=document.getElementById('tab-'+tab);
  el.innerHTML={today:viewToday,food:viewFood,body:viewBody,more:viewMore}[tab]();
  bind(el);
  window.scrollTo(0,0);
}
function refresh(){ // re-render without jumping to top
  const y=window.scrollY;render();window.scrollTo(0,y);
}

/* ============ ACTIONS ============ */
function bind(el){
  const $=s=>el.querySelector(s);
  if(tab==='today'){
    const add=()=>{day().water+=250;persist();refresh()};
    $('#addW').onclick=add;$('#glassBtn').onclick=add;
    $('#undoW').onclick=()=>{const d=day();d.water=Math.max(0,d.water-250);persist();refresh()};
    el.querySelectorAll('.task').forEach(b=>b.onclick=()=>{const d=day();d.done[b.dataset.id]?delete d.done[b.dataset.id]:d.done[b.dataset.id]=true;persist();refresh()});
  }
  if(tab==='food'){
    el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const f=FOODS[b.dataset.q];day().food.push({name:db.lang==='hi'?f[1]:f[0],cal:f[2],p:f[3]});persist();refresh()});
    $('#addF').onclick=()=>{const n=$('#fName').value.trim(),c=parseInt($('#fCal').value)||0,p=parseInt($('#fProt').value)||0;if(!n||!c)return;day().food.push({name:n,cal:c,p});persist();refresh()};
    el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{day().food.splice(+b.dataset.f,1);persist();refresh()});
  }
  if(tab==='body'){
    $('#wBtn').onclick=()=>{const w=parseFloat($('#wIn').value);if(!(w>=20&&w<=300))return;db.weights[dstr()]=w;db.profile.w=w;persist();refresh()};
    el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{day().sleep=+b.dataset.s;persist();refresh()});
    $('#pSave').onclick=()=>{
      const p=db.profile;
      p.h=parseFloat($('#pH').value)||p.h;p.w=parseFloat($('#pW').value)||p.w;p.a=parseInt($('#pA').value)||p.a;
      p.g=$('#pG').value;p.act=parseFloat($('#pAct').value);p.goal=$('#pGoal').value;
      persist();refresh();alert(t('saved'));
    };
  }
  if(tab==='more'){
    el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{db.lang=b.dataset.l;persist();refresh()});
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{db.tasks=db.tasks.filter(x=>x.id!==b.dataset.del);persist();refresh()});
    $('#nAdd').onclick=()=>{const n=$('#nName').value.trim(),tm=$('#nTime').value;if(!n||!tm)return;db.tasks.push({id:'c'+Date.now(),name:n,time:tm});persist();refresh()};
    $('#bExp').onclick=async()=>{
      const txt=JSON.stringify(db);
      try{await navigator.clipboard.writeText(txt);alert(t('copied'))}
      catch(e){prompt(t('copied'),txt)}
    };
    $('#bImp').onclick=()=>{
      const txt=prompt(t('pasteHere'));if(!txt)return;
      try{const d=JSON.parse(txt);if(!d.profile)throw 0;db=Object.assign(fresh(),d);persist();refresh();alert(t('restored'))}
      catch(e){alert(t('badBackup'))}
    };
    $('#wipe').onclick=()=>{if(confirm(t('confirmReset'))){db=fresh();persist();tab='today';render()}};
  }
}
document.getElementById('lhi').onclick=()=>{db.lang='hi';persist();refresh()};
document.getElementById('len').onclick=()=>{db.lang='en';persist();refresh()};

render();
</script>
</body>
</html>
